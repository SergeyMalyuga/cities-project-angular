<form [formGroup]="loginGroup" class="login__form form" action="#" method="post">
  <div class="login__input-wrapper form__input-wrapper">
    <label for="email" class="visually-hidden">E-mail</label>
    <input
      formControlName="email"
      id="email"
      class="login__input form__input"
      type="email"
      name="email"
      placeholder="Email"
      required=""
    />
  </div>
  <div class="login__input-wrapper form__input-wrapper">
    <label for="password" class="visually-hidden">Password</label>
    <input
      formControlName="password"
      id="password"
      class="login__input form__input"
      type="password"
      name="password"
      placeholder="Password"
      required=""
    />
  </div>
  <button class="login__submit form__submit button" type="submit">
    Sign in
  </button>
</form>

<ul class="favorites__list">
  @for (cityName of Object.keys(offers); track cityName) {
    @if (isKeyOfSortedFavoriteOffers(cityName, offers) && offers[cityName].length > 0) {
      <app-favorite-location-group class="favorites__locations-items" [cityName]="cityName" [offers]="offers[cityName]"/>
    }
  }
</ul>
